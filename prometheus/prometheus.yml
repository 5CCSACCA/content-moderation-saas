global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8000']

  - job_name: 'inference-service'
    static_configs:
      - targets: ['inference-service:8000']

  - job_name: 'submission-service'
    static_configs:
      - targets: ['submission-service:8000']